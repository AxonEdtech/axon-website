<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make Payment - AXON EdTech</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Roboto', sans-serif; 
            background: #f4f4f4; 
            text-align: center; 
            padding: 60px 20px; 
        }
        .container { 
            max-width: 520px; 
            margin: auto; 
            background: white; 
            padding: 50px 30px; 
            border-radius: 16px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.1); 
        }
        .logo {
            width: 80px;
            height: 80px;
            background: #4DC8F0;
            color: white;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 15px;
        }
        h1 { color: #111; margin: 10px 0; }
        .subtitle { color: #4DC8F0; font-weight: 500; margin-bottom: 10px; }
        .item-name {
            font-size: 20px;
            font-weight: 600;
            color: #222;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }
        .amount { 
            font-size: 38px; 
            font-weight: 700; 
            color: #4DC8F0; 
            margin: 15px 0; 
        }
        .pay-btn { 
            padding: 18px 40px; 
            background: #4DC8F0; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 18px; 
            cursor: pointer; 
            margin-top: 30px;
            width: 100%;
        }
        .pay-btn:hover { background: #38b5e6; }
        .note {
            font-size: 13.5px;
            color: #666;
            margin-top: 25px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">AXON</div>
    <h1>AXON EdTech</h1>
    <p class="subtitle">Secure Checkout</p>

    <div class="item-name" id="itemDisplay">Loading...</div>
    
    <p style="margin: 10px 0 5px;">Total Amount</p>
    <div class="amount" id="amountDisplay">₦0</div>

    <button class="pay-btn" onclick="payWithPaystack()">Pay Now with Paystack</button>
    
    <p class="note">
        🔒 Secured by Paystack<br>
        Test Mode: Use card <strong>4187 4242 4242 4242</strong><br>
        Expiry: Any future date | CVV: 123
    </p>

    <p style="margin-top: 35px; font-size: 14px;">
        <a href="index.html">← Back to Home</a>
    </p>
</div>

<script src="https://js.paystack.co/v2/inline.js"></script>

<script>
    const params = new URLSearchParams(window.location.search);
    const item = params.get('item') || "Selected Item";
    let amountNaira = parseInt(params.get('amount')) || 40000;
    
    // Fallback constants if routing parameters aren't found
    const customerName = params.get('name') || "Valued Student";
    const customerEmail = params.get('email') || "student@axon.com";
    const customerPhone = params.get('phone') || "07061864060";

    document.getElementById('itemDisplay').textContent = decodeURIComponent(item);
    document.getElementById('amountDisplay').textContent = "₦" + amountNaira.toLocaleString();

    function payWithPaystack() {
        let handler = PaystackPop.setup({
            key: 'pk_test_120c35afc6d0bf61b0ef8d8a1fd9089597676820',
            email: customerEmail,
            amount: amountNaira * 100,
            currency: "NGN",
            ref: 'AXON-' + Math.floor(Math.random() * 1000000000),
            label: decodeURIComponent(item),
            
            metadata: {
                custom_fields: [
                    {
                        display_name: "Customer Name",
                        variable_name: "customer_name",
                        value: decodeURIComponent(customerName)
                    },
                    {
                        display_name: "Purchased Item",
                        variable_name: "item",
                        value: decodeURIComponent(item)
                    },
                    {
                        display_name: "Amount",
                        variable_name: "amount",
                        value: "₦" + amountNaira.toLocaleString()
                    }
                ]
            },
            onSuccess: function(response) {
                // Pass name explicitly so receipt page displays it personalized
                window.location.href = `success.html?item=${encodeURIComponent(item)}&amount=${amountNaira}&ref=${response.reference}&name=${encodeURIComponent(customerName)}`;
            },
            onCancel: function() {
                alert('Payment was cancelled.');
            }
        });
        handler.openIframe();
    }
</script>

</body>
</html>
