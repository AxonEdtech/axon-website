<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AXON Secure Payment</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<style>

body{
font-family:Roboto,sans-serif;
background:#f4f6f9;
padding:50px 20px;
margin:0;
}

.container{

max-width:550px;
margin:auto;
background:white;
padding:40px;
border-radius:15px;
box-shadow:0 10px 35px rgba(0,0,0,.1);

}

.logo{

width:80px;
height:80px;
border-radius:50%;
background:#4DC8F0;
display:flex;
justify-content:center;
align-items:center;
font-size:26px;
font-weight:bold;
color:white;
margin:auto;

}

h1{

text-align:center;

}

.subtitle{

text-align:center;
color:#4DC8F0;
margin-bottom:30px;

}

.details{

background:#f7f7f7;
padding:20px;
border-radius:10px;
margin-bottom:25px;

}

.details p{

margin:10px 0;

}

button{

width:100%;
padding:16px;
font-size:18px;
font-weight:bold;
background:#4DC8F0;
border:none;
border-radius:8px;
color:white;
cursor:pointer;

}

button:hover{

background:#35b4e5;

}

.note{

margin-top:25px;
font-size:14px;
text-align:center;
color:#666;

}

</style>

</head>

<body>

<div class="container">

<div class="logo">AXON</div>

<h1>Secure Checkout</h1>

<p class="subtitle">

Complete your course payment securely.

</p>

<div class="details">

<p><strong>Course:</strong> <span id="course"></span></p>

<p><strong>Name:</strong> <span id="name"></span></p>

<p><strong>Email:</strong> <span id="email"></span></p>

<p><strong>Phone:</strong> <span id="phone"></span></p>

</div>

<button onclick="startPayment()">

Pay Securely

</button>

<p class="note">

🔒 Powered securely by Paystack.<br>

Your payment will be verified before your enrollment is confirmed.

</p>

</div>

<script>

const params=new URLSearchParams(window.location.search);

const course=params.get("course");

const name=params.get("name");

const email=params.get("email");

const phone=params.get("phone");

document.getElementById("course").textContent=decodeURIComponent(course);

document.getElementById("name").textContent=decodeURIComponent(name);

document.getElementById("email").textContent=email;

document.getElementById("phone").textContent=phone;



async function startPayment(){

try{

const response=await fetch("/api/initialize-payment",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

course,

name,

email,

phone

})

});

const result=await response.json();

if(result.status){

window.location.href=result.data.authorization_url;

}else{

alert(result.message || "Unable to initialize payment.");

}

}catch(error){

console.error(error);

alert("Something went wrong while connecting to the payment server.");

}

}

</script>

</body>
</html>
