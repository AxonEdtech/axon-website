<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AXON Registration</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Roboto',sans-serif;

background:
linear-gradient(135deg,#edf7fc,#f8fbff);

min-height:100vh;

padding:40px 20px;

display:flex;

justify-content:center;

align-items:center;

overflow-x:hidden;

position:relative;

}

/* Floating Background */

body::before{

content:"";

position:fixed;

width:450px;
height:450px;

background:#4DC8F025;

border-radius:50%;

top:-150px;
left:-120px;

filter:blur(90px);

animation:floatLeft 9s infinite ease-in-out;

}

body::after{

content:"";

position:fixed;

width:380px;
height:380px;

background:#35b5e525;

border-radius:50%;

bottom:-120px;
right:-100px;

filter:blur(90px);

animation:floatRight 8s infinite ease-in-out;

}

@keyframes floatLeft{

0%,100%{

transform:translateY(0);

}

50%{

transform:translateY(40px);

}

}

@keyframes floatRight{

0%,100%{

transform:translateY(0);

}

50%{

transform:translateY(-35px);

}

}

.container{

width:100%;

max-width:760px;

background:white;

border-radius:24px;

padding:45px;

box-shadow:

0 30px 80px rgba(0,0,0,.08);

position:relative;

animation:fadeIn .7s ease;

}

@keyframes fadeIn{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:translateY(0);

}

}

.container::before{

content:"";

position:absolute;

top:0;

left:0;

width:100%;

height:6px;

background:

linear-gradient(
90deg,
#4DC8F0,
#22c55e,
#4DC8F0);

background-size:300%;

animation:borderMove 6s linear infinite;

}

@keyframes borderMove{

100%{

background-position:300%;

}

}

h1{

text-align:center;

font-size:38px;

color:#222;

margin-bottom:8px;

font-weight:700;

}

.course{

text-align:center;

font-size:24px;

font-weight:700;

color:#4DC8F0;

margin-bottom:35px;

}

/* ===========================
PROGRESS BAR
=========================== */

.progress-bar{

height:8px;

background:#edf2f7;

border-radius:20px;

margin-bottom:35px;

overflow:hidden;

}

.progress-fill{

width:35%;

height:100%;

background:linear-gradient(90deg,#4DC8F0,#35b5e5);

border-radius:20px;

animation:progressMove 2s infinite alternate;

}

@keyframes progressMove{

from{

width:25%;

}

to{

width:35%;

}

}

/* ===========================
INPUT GROUP
=========================== */

.input-group{

position:relative;

margin-bottom:28px;

}

.input-group input,
.input-group textarea,
.input-group select{

width:100%;

padding:18px 16px;

font-size:16px;

border:2px solid #e5e7eb;

border-radius:12px;

background:white;

transition:.3s;

outline:none;

}

.input-group input:focus,
.input-group textarea:focus,
.input-group select:focus{

border-color:#4DC8F0;

box-shadow:

0 0 0 4px rgba(77,200,240,.12);

}

.input-group label{

position:absolute;

left:16px;

top:18px;

background:white;

padding:0 6px;

color:#888;

transition:.25s;

pointer-events:none;

}

.input-group input:focus+label,
.input-group input:not(:placeholder-shown)+label,
.input-group textarea:focus+label,
.input-group textarea:not(:placeholder-shown)+label,
.input-group select:focus+label,
.input-group select:valid+label{

top:-10px;

font-size:13px;

color:#4DC8F0;

font-weight:700;

}

/* ===========================
COURSE SUMMARY
=========================== */

.course-summary{

background:#f8fcff;

border:1px solid #dbeafe;

padding:22px;

border-radius:16px;

margin:35px 0;

}

.course-summary h3{

margin-bottom:18px;

color:#222;

}

.summary-row{

display:flex;

justify-content:space-between;

padding:10px 0;

border-bottom:1px solid #eef2f7;

}

.summary-row:last-child{

border-bottom:none;

}

.summary-row span{

color:#666;

}

.summary-row strong{

color:#111;

}

/* ===========================
BUTTON
=========================== */

button{

width:100%;

padding:18px;

border:none;

border-radius:14px;

background:linear-gradient(
135deg,
#4DC8F0,
#35b5e5);

font-size:18px;

font-weight:700;

color:white;

cursor:pointer;

transition:.3s;

}

button:hover{

transform:translateY(-3px);

box-shadow:

0 18px 35px rgba(77,200,240,.28);

}

.input-group input,
.input-group textarea,
.input-group select{

transition:
.3s,
transform .25s;

}

.input-group input:focus,
.input-group textarea:focus,
.input-group select:focus{

transform:translateY(-2px);

}

button{

position:relative;

overflow:hidden;

}

button::before{

content:"";

position:absolute;

left:-120%;

top:0;

width:120%;

height:100%;

background:

linear-gradient(
90deg,
transparent,
rgba(255,255,255,.35),
transparent);

transition:.8s;

}

button:hover::before{

left:130%;

}

</style>

</head>

<body>

<div class="container">

<h1>Student Registration</h1>

<div class="course" id="courseTitle"></div>



<form id="registrationForm">

    <div class="progress-bar">
    
    <div class="progress-fill"></div>
    
    </div>
    
    <div class="input-group">
    
    <input
    id="name"
    type="text"
    required
    placeholder=" ">
    
    <label for="name">
    
    Full Name
    
    </label>
    
    </div>
    
    <div class="input-group">
    
    <input
    id="email"
    type="email"
    required
    placeholder=" ">
    
    <label for="email">
    
    Email Address
    
    </label>
    
    </div>
    
    <div class="input-group">
    
    <input
    id="phone"
    type="tel"
    required
    pattern="[0-9]{11}"
    placeholder=" ">
    
    <label for="phone">
    
    Phone Number
    
    </label>
    
    </div>
    
    <div class="input-group">
    
    <select
    id="gender"
    required>
    
    <option value=""></option>
    
    <option>Male</option>
    
    <option>Female</option>
    
    </select>
    
    <label for="gender">
    
    Gender
    
    </label>
    
    </div>
    
    <div class="input-group">
    
    <textarea
    id="message"
    rows="4"
    placeholder=" "></textarea>
    
    <label for="message">
    
    Additional Information (Optional)
    
    </label>
    
    </div>
    
    <div class="course-summary">
    
    <h3>
    
    Enrollment Summary
    
    </h3>
    
    <div class="summary-row">
    
    <span>Selected Course</span>
    
    <strong id="summaryCourse"></strong>
    
    </div>
    
    <div class="summary-row">
    
    <span>Training Mode</span>
    
    <strong>Physical / Online</strong>
    
    </div>
    
    <div class="summary-row">
    
    <span>Certificate</span>
    
    <strong>Included</strong>
    
    </div>
    
    </div>
    
    <button
    type="submit"
    id="submitBtn">
    
    Continue Securely →
    
    </button>
    
    </form>

<div class="back">

<a href="index.html">

← Back to Home

</a>

</div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const course = params.get("type") || "Selected Course";

document.getElementById("courseTitle").innerHTML = decodeURIComponent(course);

document.getElementById("summaryCourse").innerHTML = decodeURIComponent(course);


// ===========================
// Phone Formatting
// ===========================

const phoneInput = document.getElementById("phone");

phoneInput.addEventListener("input", function () {

    this.value = this.value.replace(/\D/g, "");

    if (this.value.length > 11) {

        this.value = this.value.slice(0, 11);

    }

});


// ===========================
// Email Validation
// ===========================

const emailInput = document.getElementById("email");

emailInput.addEventListener("input", function () {

    const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (this.value === "") {

        this.style.borderColor = "#ddd";

    }

    else if (valid.test(this.value)) {

        this.style.borderColor = "#28c76f";

    }

    else {

        this.style.borderColor = "#ef4444";

    }

});


// ===========================
// Registration Submit
// ===========================

document.getElementById("registrationForm").addEventListener("submit", function(e){

    e.preventDefault();

    const btn = document.getElementById("submitBtn");

    btn.disabled = true;

    btn.innerHTML = "Preparing Payment...";

    const name = document.getElementById("name").value.trim();

    const email = document.getElementById("email").value.trim();

    const phone = document.getElementById("phone").value.replace(/\D/g, "");

    const gender = document.getElementById("gender").value;

    const message = document.getElementById("message").value;

    setTimeout(() => {

        window.location.href =
        `payment.html?course=${encodeURIComponent(course)}
        &name=${encodeURIComponent(name)}
        &email=${encodeURIComponent(email)}
        &phone=${encodeURIComponent(phone)}
        &gender=${encodeURIComponent(gender)}
        &message=${encodeURIComponent(message)}`;

    },1000);

});

</script>

</body>
</html>
