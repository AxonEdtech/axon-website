<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - AXON EdTech</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Roboto', sans-serif; 
            background: #f8f9fa; 
            margin: 0; 
            padding: 40px 20px; 
        }
        .container { 
            max-width: 700px; 
            margin: auto; 
            background: white; 
            padding: 40px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
        }
        h1 { 
            text-align: center; 
            color: #111; 
            margin-bottom: 8px; 
        }
        .item-name { 
            text-align: center; 
            color: #4DC8F0; 
            font-size: 24px; 
            margin-bottom: 30px; 
            font-weight: 500; 
        }
        form { 
            display: grid; 
            gap: 18px; 
        }
        label { 
            font-weight: 500; 
            margin-bottom: 5px; 
            display: block; 
        }
        input, textarea, select { 
            padding: 14px; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            font-size: 16px; 
        }
        button { 
            padding: 16px; 
            background: #4DC8F0; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 17px; 
            cursor: pointer; 
            margin-top: 10px;
        }
        button:hover { background: #38b5e6; }
        .back { 
            text-align: center; 
            margin-top: 25px; 
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Registration Form</h1>
    <p class="item-name" id="itemName">Loading...</p>

    <!-- Changed form submit action logic to pass full parameters cleanly -->
    <form id="regForm" onsubmit="handleRegistrationSubmit(event)">
        <input type="hidden" name="item" id="hiddenItem">
        <input type="hidden" name="amount" id="hiddenAmount">

        <label>Full Name</label>
        <input type="text" id="regName" name="name" placeholder="Enter full name" required>

        <label>Email Address</label>
        <input type="email" id="regEmail" name="email" placeholder="example@domain.com" required>

        <label>Phone Number</label>
        <input type="tel" id="regPhone" name="phone" value="07061864060" required>

        <label>Gender</label>
        <select name="gender" required>
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select>

        <label>Message / Additional Info (Optional)</label>
        <textarea name="message" rows="4" placeholder="Any special request or note..."></textarea>

        <button type="submit">Proceed to Payment</button>
    </form>

    <div class="back">
        <a href="index.html">← Back to Home</a>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    let item = params.get('type') || "Selected Item";

    document.getElementById('itemName').textContent = decodeURIComponent(item);
    document.getElementById('hiddenItem').value = decodeURIComponent(item);

    const priceMap = {
        "Microsoft Word": 35000,
        "Microsoft Excel": 45000,
        "PowerPoint": 35000,
        "CorelDRAW": 55000,
        "Photoshop": 60000,
        "Desktop Publishing": 50000,
        "Secretariat Studies": 40000,
        "Data Analysis": 65000,
        "Ethical Hacking": 85000,
        "Cybersecurity": 70000,
        "Digital Marketing": 55000,
        "UI/UX Design": 75000,
        "Web Development": 80000,
        "Python Programming": 70000,
        "Data Science": 90000,
        "NYSC Registration": 15000,
        "JAMB Registration": 8000,
        "WAEC and NECO": 12000,
        "CAC Registration": 25000,
        "Type Setting": 10000,
        "Printing and Photocopy": 5000,
        "Printing Press": 30000,
        "Computer Repair": 15000,
        "Computer Sales": 0,          
        "Graphic Design": 25000,
        "Letter Heading": 12000,
        "Passport Photograph": 3000,
        "Web3 and Smart Contract Systems": 40000
    };

    let amount = 45000; 

    for (let key in priceMap) {
        if (item.toLowerCase().includes(key.toLowerCase())) {
            amount = priceMap[key];
            break;
        }
    }

    document.getElementById('hiddenAmount').value = amount;

    // Package details and pass directly into the URL parameters for payment page
    function handleRegistrationSubmit(event) {
        event.preventDefault();
        const finalItem = document.getElementById('hiddenItem').value;
        const finalAmount = document.getElementById('hiddenAmount').value;
        const finalName = document.getElementById('regName').value;
        const finalEmail = document.getElementById('regEmail').value;
        const finalPhone = document.getElementById('regPhone').value;

        window.location.href = `payment.html?item=${encodeURIComponent(finalItem)}&amount=${finalAmount}&name=${encodeURIComponent(finalName)}&email=${encodeURIComponent(finalEmail)}&phone=${encodeURIComponent(finalPhone)}`;
    }
</script>

</body>
</html>
