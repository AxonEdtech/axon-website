<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AXON Registration</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<style>

body{
font-family:Roboto,sans-serif;
background:#f5f7fa;
margin:0;
padding:40px 20px;
}

.container{
max-width:700px;
margin:auto;
background:#fff;
padding:40px;
border-radius:15px;
box-shadow:0 10px 35px rgba(0,0,0,.1);
}

h1{
text-align:center;
margin-bottom:10px;
}

.course{
text-align:center;
color:#4DC8F0;
font-size:24px;
font-weight:700;
margin-bottom:35px;
}

label{
display:block;
margin-bottom:6px;
font-weight:600;
}

input,
textarea,
select{

width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:8px;
font-size:16px;
box-sizing:border-box;
margin-bottom:18px;

}

button{

width:100%;
padding:16px;
background:#4DC8F0;
border:none;
border-radius:8px;
font-size:17px;
font-weight:700;
color:white;
cursor:pointer;

}

button:hover{

background:#39b6e5;

}

.back{

margin-top:25px;
text-align:center;

}

</style>

</head>

<body>

<div class="container">

<h1>Student Registration</h1>

<div class="course" id="courseTitle"></div>

<form id="registrationForm">

<label>Full Name</label>

<input
id="name"
type="text"
required
placeholder="Enter your full name">

<label>Email Address</label>

<input
id="email"
type="email"
required
placeholder="example@email.com">

<label>Phone Number</label>

<input
id="phone"
type="tel"
required
pattern="[0-9]{11}"
placeholder="08012345678">

<label>Gender</label>

<select id="gender" required>

<option value="">Select Gender</option>

<option>Male</option>

<option>Female</option>

</select>

<label>Additional Information</label>

<textarea
id="message"
rows="4"
placeholder="Optional"></textarea>

<button type="submit">

Continue to Payment

</button>

</form>

<div class="back">

<a href="index.html">

← Back to Home

</a>

</div>

</div>

<script>

const params=new URLSearchParams(window.location.search);

const course=params.get("type") || "Selected Course";

document.getElementById("courseTitle").innerHTML=decodeURIComponent(course);

document.getElementById("registrationForm").addEventListener("submit",function(e){

e.preventDefault();

const name=document.getElementById("name").value.trim();

const email=document.getElementById("email").value.trim();

const phone=document.getElementById("phone").value.trim();

const gender=document.getElementById("gender").value;

const message=document.getElementById("message").value;

window.location.href=

`payment.html?course=${encodeURIComponent(course)}
&name=${encodeURIComponent(name)}
&email=${encodeURIComponent(email)}
&phone=${encodeURIComponent(phone)}
&gender=${encodeURIComponent(gender)}
&message=${encodeURIComponent(message)}`;

});

</script>

</body>
</html>
